name: Build Android app (debug)

# Builds the Trivia or Nada Android app on an Ubuntu runner in the cloud.
# Produces an unsigned debug APK: it proves the project compiles, but
# it is not a signed release and cannot be submitted to Google Play
# (release signing + Play registration still needed).
#
# Triggers: every push to main, or manually from the Actions tab
# (Actions -> Build Android app (debug) -> Run workflow).
#
# Note: the Linux dev VM cannot run this build locally — Gradle's
# daemon communicates over a local TCP socket, and the VM sandbox
# blocks Java cross-process TCP (other_tcp denied). The SDK/JDK are
# installed on the VM (see README), but the build itself has to run
# here in the cloud. See README "Android build" section.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor web assets into the Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Explicit packages: the action's defaults include the legacy
      # "tools" package, which Google's SDK repo no longer publishes.
      # The step below installs the full set the build needs anyway.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # The project targets SDK 36 (see android/variables.gradle).
      # Install exactly those components so the build never depends
      # on whatever the runner image happens to ship.
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trivia-or-nada-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
